<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" type="text/css" href="./styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie Search</title>
</head>

<body>

  <header>
    <h1>Movie database</h1>
  </header>

  <div class="background"></div>

    <main>


      <div class="table-container">

  <input type="text" id="eidr" name="eidr"></input>
  <input type="text" id="genre" name="genre"></input>
  <button onclick="loadMovies()">Search</button>

  <table border="1">
    <thead>
      <tr>
        <th data-sort="title">Title</th>
        <th data-sort="eidr">EIDR</th>
        <th data-sort="datePublished">Date Published</th>
        <th data-sort="genre">Genre</th>
        <th data-sort="directorName">Director</th>
      </tr>
    </thead>
    <tbody id="movies-body">
      <!-- rows inserted here -->
    </tbody>
  </table>
</div>

    </main>
    
  <script src="table.js"></script>

</body>
</html>
